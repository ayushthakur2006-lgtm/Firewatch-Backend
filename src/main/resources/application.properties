# Backend Configuration
spring.application.name=firewatch-backend
server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/firewatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# NASA FIRMS API Configuration
nasa.firms.map-key=${NASA_FIRMS_MAP_KEY}
nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api/area/csv
nasa.firms.default-source=VIIRS_SNPP_NRT
nasa.firms.default-days=5

# ML Microservice Configuration
ml.service.url=http://localhost:8000/predict
ml.service.enabled=true
ml.service.connect-timeout-ms=5000
ml.service.read-timeout-ms=10000

# Satellite API Configuration (set satellite.api.enabled=true to activate Sentinel Hub)
satellite.api.enabled=true

# Sentinel Hub Integration (Sentinel-2 real satellite data)
sentinel.hub.client-id=${SENTINEL_HUB_CLIENT_ID:}
sentinel.hub.client-secret=${SENTINEL_HUB_CLIENT_SECRET:}
sentinel.hub.token-url=https://services.sentinel-hub.com/auth/realms/main/protocol/openid-connect/token
sentinel.hub.process-url=https://services.sentinel-hub.com/api/v1/statistics
sentinel.hub.land-cover-dataset=${SENTINEL_HUB_LAND_COVER_DATASET:byoc-0b940c63-45dd-4e6b-8019-c3660b81b884}

# Logging Configuration
logging.level.com.firewatch.firewatch_backend=INFO
logging.level.org.springframework.web=INFO
